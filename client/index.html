<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="./src/assets/images/logo.svg" />
        <link rel="apple-touch-icon" href="/logo2.png" />
        <link rel="manifest" href="/manifest.json" />
        <meta name="apple-mobile-web-app-title" content="Balance Box" />
        <meta name="android-mobile-web-app-title" content="Balance Box" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <meta name="theme-color" content="#ffffff" />
        <script>
            (function () {
                var theme = localStorage.getItem('balancebox-theme') || 'light';
                var dark =
                    theme === 'dark' ||
                    (theme === 'system' &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', dark);
                var path = location.pathname;
                var userId = localStorage.getItem('userId');
                var guest = !userId || userId === 'null';
                var grey = /^\/(activity|analytics|budgeting|account)\/?$/.test(path);
                var auth = /^\/(login|register)\/?$/.test(path);
                var color = grey
                    ? dark
                        ? '#111113'
                        : '#F8F9FB'
                    : auth
                      ? dark
                          ? '#111113'
                          : '#f9fafb'
                      : path === '/' && guest
                        ? dark
                            ? '#111113'
                            : '#f4f3f0'
                        : dark
                          ? '#1c1c1e'
                          : '#ffffff';
                document.documentElement.style.setProperty('--status-bar', color);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', color);
            })();
        </script>
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <title>BalanceBox — free finance budgeting app</title>
        <meta
            name="description"
            content="BalanceBox is a free finance budgeting app for your phone. Track cards, income, and expenses, and see what you can spend."
        />
        <link rel="canonical" href="https://balancebox.online/" />
        <meta property="og:title" content="BalanceBox — free finance budgeting app" />
        <meta
            property="og:description"
            content="A free budgeting app for your cards, income, and expenses."
        />
        <meta property="og:url" content="https://balancebox.online/" />
        <meta property="og:type" content="website" />
        <meta property="og:image" content="https://balancebox.online/logo2.png" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="BalanceBox — free finance budgeting app" />
        <meta
            name="twitter:description"
            content="A free budgeting app for your cards, income, and expenses."
        />
        <meta name="twitter:image" content="https://balancebox.online/logo2.png" />
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "SoftwareApplication",
                "name": "BalanceBox",
                "applicationCategory": "FinanceApplication",
                "operatingSystem": "Web",
                "url": "https://balancebox.online/",
                "description": "BalanceBox is a free finance budgeting app for tracking cards, income, and expenses.",
                "offers": {
                    "@type": "Offer",
                    "price": "0",
                    "priceCurrency": "USD"
                }
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
